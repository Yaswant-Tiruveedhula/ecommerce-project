spring.application.name=ecommerce-api
server.port=${PORT:8080}
spring.profiles.default=local
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerce}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&sslMode=${DB_SSL_MODE:DISABLED}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
info.app.name=E-commerce API
info.app.description=Secure e-commerce REST API
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-seconds=600
app.jwt.refresh-token-days=30
app.cookie.secure=${APP_COOKIE_SECURE:false}
app.cookie.same-site=${APP_COOKIE_SAME_SITE:Lax}
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
app.store.currency=${STORE_CURRENCY:USD}
springdoc.swagger-ui.path=/swagger-ui.html
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
