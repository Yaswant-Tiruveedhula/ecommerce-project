spring.datasource.url=jdbc:h2:mem:ecomtest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
app.jwt.secret=test-signing-secret-that-is-at-least-32-bytes-long
app.jwt.access-token-seconds=600
app.jwt.refresh-token-days=30
app.cookie.secure=false
app.cookie.same-site=Lax
app.cors.allowed-origins=http://localhost:5173
app.seed.demo-data=false
